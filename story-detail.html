<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Story · SUACC</title>
<link rel="stylesheet" href="styles.css">
<style>
  :root{--st-ease:cubic-bezier(.22,.61,.36,1);--reveal-ease:cubic-bezier(.16,1,.3,1)}
  html{scroll-behavior:smooth}
  body.st-immersive{margin:0;background:#0b0b0c;color:#fff;font-family:'IBM Plex Sans Thai',sans-serif}
  .st-serif{font-family:'Silpakorn72','IBM Plex Sans Thai',sans-serif}

  /* progress bar */
  .st-progress{position:fixed;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.14);z-index:120}
  .st-progress i{display:block;height:100%;width:0;background:#fff;transition:width .1s linear}

  /* top bar */
  .st-top{position:fixed;top:0;left:0;right:0;z-index:110;display:flex;align-items:center;justify-content:space-between;
    padding:16px 26px;transition:background .3s var(--st-ease),padding .3s var(--st-ease)}
  .st-top.solid{background:rgba(11,11,12,.85);backdrop-filter:blur(8px);padding:10px 26px}
  .st-top .st-brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;font-size:14px;letter-spacing:.02em}
  .st-top .st-brand img{height:34px;width:auto;filter:brightness(0) invert(1)}
  .st-top .st-tools{display:flex;align-items:center;gap:6px}
  .st-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
    background:rgba(255,255,255,.08);border:none;cursor:pointer;text-decoration:none;transition:.15s}
  .st-icon:hover{background:rgba(255,255,255,.2)}
  .st-icon svg{width:18px;height:18px}

  /* COVER */
  .st-cover{position:relative;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 24px;scroll-snap-align:start;overflow:hidden}
  .st-cover-bg{position:absolute;left:0;right:0;top:-26%;height:152%;background-size:cover;background-position:center;z-index:0;will-change:transform}
  .st-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,.55) 0%,rgba(11,11,12,.35) 40%,rgba(11,11,12,.75) 100%);z-index:1}
  .st-cover-inner{position:relative;z-index:2;max-width:860px}
  .st-eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:13px;font-weight:700;color:rgba(255,255,255,.8);margin:0 0 22px}
  .st-title{font-weight:700;font-size:clamp(34px,6vw,72px);line-height:1.12;margin:0}
  .st-sub{font-size:clamp(16px,1.7vw,21px);line-height:1.65;color:rgba(255,255,255,.9);margin:22px auto 0;max-width:640px}
  .st-share{display:flex;gap:12px;justify-content:center;margin:34px 0 0}
  .st-byline{margin:26px 0 0;font-size:14px;color:rgba(255,255,255,.7);letter-spacing:.02em}
  .st-cue{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;
    color:rgba(255,255,255,.85);font-size:12px;letter-spacing:.15em;text-transform:uppercase}
  .st-cue svg{width:22px;height:22px;animation:stbob 1.8s var(--st-ease) infinite}
  @keyframes stbob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}

  /* CHAPTER */
  .st-chapter{position:relative;min-height:100vh;display:flex;align-items:flex-end;scroll-snap-align:start;overflow:hidden}
  .st-chapter-bg{position:absolute;left:0;right:0;top:-28%;height:156%;background-size:cover;background-position:center;z-index:0;will-change:transform}
  .st-chapter::after{content:'';position:absolute;inset:0;z-index:1;
    background:linear-gradient(90deg,rgba(6,6,8,.86) 0%,rgba(6,6,8,.5) 42%,rgba(6,6,8,.12) 70%,transparent 100%)}
  .st-chapter[data-side="right"]::after{background:linear-gradient(270deg,rgba(6,6,8,.86) 0%,rgba(6,6,8,.5) 42%,rgba(6,6,8,.12) 70%,transparent 100%)}
  .st-card{position:relative;z-index:2;max-width:520px;margin:0 0 9vh 7vw}
  .st-chapter[data-side="right"] .st-card{margin-left:auto;margin-right:7vw}
  /* reveal นุ่ม + stagger ทีละบรรทัด */
  .st-card > *{opacity:0;transform:translateY(32px);transition:opacity 1s var(--reveal-ease),transform 1s var(--reveal-ease)}
  .st-chapter.in .st-card > *{opacity:1;transform:none}
  .st-chapter.in .st-card > *:nth-child(1){transition-delay:.02s}
  .st-chapter.in .st-card > *:nth-child(2){transition-delay:.12s}
  .st-chapter.in .st-card > *:nth-child(3){transition-delay:.22s}
  .st-chapter.in .st-card > *:nth-child(4){transition-delay:.32s}
  .st-num{font-family:'Silpakorn72',sans-serif;font-weight:700;font-size:15px;letter-spacing:.28em;color:rgba(255,255,255,.55);display:block;margin:0 0 14px}
  .st-card h2{font-weight:700;font-size:clamp(26px,3.2vw,42px);line-height:1.2;margin:0}
  .st-meta{margin:12px 0 0;font-size:14px;color:#c9c1a8;letter-spacing:.02em}
  .st-card p.st-text{margin:18px 0 0;font-size:17px;line-height:1.85;color:rgba(255,255,255,.9);max-height:38vh;overflow-y:auto}
  .st-caption{position:absolute;z-index:2;right:22px;bottom:18px;font-size:12px;color:rgba(255,255,255,.6);text-align:right;max-width:360px}

  /* SPLIT layout — ครึ่งข้อความ(พื้นขาว) / ครึ่งภาพ */
  .st-split{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#fff;color:#111}
  .st-split[data-side="right"] .st-split-text{order:2}
  .st-split[data-side="right"] .st-split-img{order:1}
  .st-split-text{display:flex;flex-direction:column;justify-content:center;padding:9vh 6vw;max-width:700px}
  .st-split-text .st-num{color:#0a7256}
  .st-split-text h2{font-family:'Silpakorn72','IBM Plex Sans Thai',sans-serif;font-weight:700;font-size:clamp(24px,2.6vw,36px);line-height:1.25;margin:0 0 14px;color:#0d0d0d}
  .st-split-text .st-meta{color:#6b6b6b;margin:0 0 18px}
  .st-split-text .st-text{font-size:clamp(17px,1.35vw,20px);line-height:1.9;color:#2a2a2a;max-height:none;overflow:visible}
  .st-split-img{position:relative;overflow:hidden;min-height:62vh}
  .st-split-photo{position:absolute;inset:0;background-size:cover;background-position:center}
  .st-info{position:absolute;top:16px;left:16px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.42);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-style:italic;font-family:Georgia,serif}
  /* reveal (split) */
  .st-split-text > *{opacity:0;transform:translateY(28px);transition:opacity 1s var(--reveal-ease),transform 1s var(--reveal-ease)}
  .st-split.in .st-split-text > *{opacity:1;transform:none}
  .st-split.in .st-split-text > *:nth-child(1){transition-delay:.02s}
  .st-split.in .st-split-text > *:nth-child(2){transition-delay:.12s}
  .st-split.in .st-split-text > *:nth-child(3){transition-delay:.22s}
  .st-split.in .st-split-text > *:nth-child(4){transition-delay:.32s}
  @media(max-width:820px){
    .st-split{grid-template-columns:1fr;min-height:auto}
    .st-split[data-side="right"] .st-split-text,.st-split[data-side="right"] .st-split-img{order:0}
    .st-split-img{min-height:56vh}
    .st-split-text{padding:44px 24px}
  }

  /* END */
  .st-end{background:#0b0b0c;padding:100px 24px 90px;text-align:center;scroll-snap-align:start}
  .st-end .st-eyebrow{color:#c9c1a8}
  .st-end h2{font-weight:700;font-size:clamp(26px,3vw,40px);margin:0 0 14px}
  .st-end .st-credit{color:rgba(255,255,255,.7);font-size:15px;line-height:1.8;margin:0 auto 34px;max-width:560px}
  .st-back{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#0b0b0c;border-radius:40px;padding:14px 30px;font-weight:700;text-decoration:none;transition:.15s}
  .st-back:hover{background:#e9e4d6}
  .st-related{max-width:1120px;margin:70px auto 0}
  .st-related-h{font-weight:700;font-size:22px;margin:0 0 24px;text-align:left}
  .st-rel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .st-rel{position:relative;display:block;aspect-ratio:3/4;border-radius:14px;overflow:hidden;text-decoration:none;background-size:cover;background-position:center}
  .st-rel::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.82) 100%)}
  .st-rel span{position:absolute;z-index:2;left:20px;right:20px;bottom:18px;color:#fff;font-weight:700;font-size:18px;line-height:1.35;text-align:left}

  @media(max-width:720px){
    .st-card{margin:0 20px 12vh;max-width:none}
    .st-chapter[data-side="right"] .st-card{margin:0 20px 12vh}
    .st-chapter::after,.st-chapter[data-side="right"]::after{background:linear-gradient(180deg,rgba(6,6,8,.2) 0%,rgba(6,6,8,.55) 55%,rgba(6,6,8,.9) 100%)}
    .st-chapter{align-items:flex-end}
    .st-rel-grid{grid-template-columns:1fr}
    .st-related-h{text-align:center}
  }
</style>
</head>
<body class="st-immersive">

<div id="site-nav"></div>

<main id="storyRoot"></main>

<script src="collection-data.js"></script>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var id=parseInt(params.get('id'),10)||1;
  var story=(window.COLL_STORIES||[]).filter(function(s){return s.id===id;})[0] || (window.COLL_STORIES||[])[0];
  if(!story) return;
  document.title=story.title+' · SUACC Stories';

  var shareIcons =
    '<a class="st-icon" href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 9h3V6h-3c-1.7 0-3 1.3-3 3v2H9v3h2v6h3v-6h2.5l.5-3H14V9.5c0-.3.2-.5.5-.5z"/></svg></a>'+
    '<a class="st-icon" href="#" aria-label="X"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 3h3l-6.5 7.4L21 21h-5.6l-4-5.3L6.6 21H3.5l7-8L3 3h5.7l3.6 4.8L17 3z"/></svg></a>'+
    '<a class="st-icon" href="#" aria-label="คัดลอกลิงก์"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></a>';

  /* COVER */
  var cover =
    '<section class="st-cover" id="cover">'+
      '<div class="st-cover-bg" style="background-image:url(\''+story.cover+'\')"></div>'+
      '<div class="st-cover-inner">'+
        '<p class="st-eyebrow">SUACC Stories</p>'+
        '<h1 class="st-title st-serif">'+story.title+'</h1>'+
        '<p class="st-sub">'+story.excerpt+'</p>'+
        '<div class="st-share">'+shareIcons+'</div>'+
        '<p class="st-byline">โดย '+story.author+' · '+story.date+' · '+(story.read||'')+'</p>'+
      '</div>'+
      '<div class="st-cue">เลื่อนเพื่ออ่าน<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></div>'+
    '</section>';

  /* CHAPTERS — ใช้ story.chapters (เลือก layout ได้) ถ้ามี · ไม่งั้น derive จาก artworkIds (overlay) */
  var chList=[];
  if(story.chapters && story.chapters.length){
    chList=story.chapters;
  } else {
    (story.artworkIds||[]).forEach(function(aid){
      var w=window.collById?window.collById(aid):null; if(!w) return;
      chList.push({
        image: window.collCover?window.collCover(w):w.cover,
        title: w.title,
        meta: [w.artist,(w.year?'พ.ศ. '+w.year:''),w.technique].filter(Boolean).join(' · '),
        body: w.concept||w.exhibition||'',
        layout: 'overlay'
      });
    });
  }

  var chapters=chList.map(function(c,i){
    var num=('0'+(i+1)).slice(-2), side=(i%2===0)?'left':'right';
    var img=c.image||c.cover||'', meta=c.meta||'', body=c.body||'';
    if((c.layout||'overlay')==='split'){
      /* SPLIT — ครึ่งข้อความ(ขาว)/ครึ่งภาพ */
      return '<section class="st-split" data-side="'+side+'">'+
          '<div class="st-split-text">'+
            '<span class="st-num">บทที่ '+num+'</span>'+
            (c.title?'<h2 class="st-serif">'+c.title+'</h2>':'')+
            (meta?'<p class="st-meta">'+meta+'</p>':'')+
            (body?'<p class="st-text">'+body+'</p>':'')+
          '</div>'+
          '<div class="st-split-img">'+
            '<div class="st-split-photo" style="background-image:url(\''+img+'\')"></div>'+
            '<span class="st-info" aria-hidden="true">i</span>'+
          '</div>'+
        '</section>';
    }
    /* OVERLAY — ภาพเต็มจอ + การ์ด (default) */
    return '<section class="st-chapter" data-side="'+side+'">'+
        '<div class="st-chapter-bg" style="background-image:url(\''+img+'\')"></div>'+
        '<div class="st-card">'+
          '<span class="st-num">บทที่ '+num+'</span>'+
          (c.title?'<h2 class="st-serif">'+c.title+'</h2>':'')+
          (meta?'<p class="st-meta">'+meta+'</p>':'')+
          (body?'<p class="st-text">'+body+'</p>':'')+
        '</div>'+
        '<p class="st-caption">'+(c.title||'')+'</p>'+
      '</section>';
  }).join('');

  /* RELATED */
  var related=(window.COLL_STORIES||[]).filter(function(s){return s.id!==story.id;}).slice(0,3).map(function(s){
    return '<a class="st-rel" href="story-detail.html?id='+s.id+'" style="background-image:url(\''+s.cover+'\')"><span>'+s.title+'</span></a>';
  }).join('');

  var end =
    '<section class="st-end">'+
      '<p class="st-eyebrow">จบเรื่อง</p>'+
      '<h2 class="st-serif">'+story.title+'</h2>'+
      '<p class="st-credit">เรียบเรียงโดย '+story.author+'<br>เผยแพร่ '+story.date+' · สำนักศิลปวัฒนธรรมและการสร้างสรรค์ฯ มหาวิทยาลัยศิลปากร</p>'+
      '<a class="st-back" href="stories.html"><svg width="18" height="14" viewBox="0 0 20 14" fill="none"><path d="M19 7H2M8 1L1 7l7 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>เรื่องเล่าอื่น ๆ</a>'+
      (related?'<div class="st-related"><h3 class="st-related-h st-serif">เรื่องเล่าที่เกี่ยวข้อง</h3><div class="st-rel-grid">'+related+'</div></div>':'')+
    '</section>';

  document.getElementById('storyRoot').innerHTML = cover + chapters + end;

  /* reveal chapters — trigger ก่อนเข้าเต็มจอ ให้นุ่ม */
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if('IntersectionObserver' in window && !reduce){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });},{threshold:0,rootMargin:'0px 0px -22% 0px'});
    document.querySelectorAll('.st-chapter,.st-split').forEach(function(c){ io.observe(c); });
  } else {
    document.querySelectorAll('.st-chapter,.st-split').forEach(function(c){ c.classList.add('in'); });
  }

  /* parallax — ภาพ bg เลื่อนช้ากว่าการ scroll */
  if(!reduce){
    var bgs=[].slice.call(document.querySelectorAll('.st-cover-bg,.st-chapter-bg'));
    var ticking=false;
    function parallax(){
      var vh=window.innerHeight;
      bgs.forEach(function(bg){
        var r=bg.parentElement.getBoundingClientRect();
        if(r.bottom < -vh*0.4 || r.top > vh*1.4) return;
        var offset=(r.top + r.height/2 - vh/2);
        bg.style.transform='translate3d(0,'+(offset*-0.22).toFixed(1)+'px,0)';
      });
      ticking=false;
    }
    function onScroll(){ if(!ticking){ ticking=true; requestAnimationFrame(parallax); } }
    window.addEventListener('scroll', onScroll, {passive:true});
    window.addEventListener('resize', parallax);
    parallax();
  }
})();
</script>
<div id="site-footer"></div>
<script src="site.js"></script>
</body>
</html>
