<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายละเอียดกิจกรรม · SUACC</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* ===== Banner: พื้นหลัง = ภาพ cover เบลอ + การ์ดกระจกขาว (ดีไซน์เดียวกับ whatson-detail-v1) ===== */
  .detail-hero{position:relative;overflow:hidden;padding:60px 0}
  .detail-hero .hero-bg{position:absolute;inset:-60px;background-size:cover;background-position:center;
    filter:blur(40px) saturate(1.3);transform:scale(1.15);z-index:0}
  .detail-hero .hero-wash{position:absolute;inset:0;background:rgba(245,245,245,.3);z-index:1}
  .detail-hero .wrap{position:relative;z-index:2}
  .detail-card{display:grid;grid-template-columns:minmax(0,300px) 1fr;align-items:stretch;overflow:hidden;
    max-width:980px;margin:0 auto;
    background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:none;border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.18)}
  .detail-card .poster{display:block;width:100%;height:auto;align-self:start;background:#f0eeec}
  .detail-info{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:34px 40px}
  .detail-info h1{margin:0;font-size:clamp(24px,2.3vw,30px);line-height:1.3;color:#0d0d0d}
  .detail-info .won-meta{font-size:17px;gap:12px;margin-top:2px;color:#0d0d0d;font-weight:600}
  .detail-info .won-meta svg{width:20px;height:20px;color:#0d0d0d}
  .d-tag{align-self:flex-start;display:inline-block;border-radius:30px;padding:7px 18px;font-weight:700;font-size:14px;color:#0d0d0d}
  /* ===== Content: center กลางจอ · rich content (ย่อหน้า/หัวข้อ/รูป) ===== */
  .detail-content{max-width:820px;margin:0 auto}
  .detail-head{display:flex;align-items:center;justify-content:space-between;gap:16px;
    border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:26px}
  .detail-head h2{margin:0;font-size:24px}
  .share{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:600;font-size:15px}
  .share a{display:flex;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    align-items:center;justify-content:center;color:#333;transition:.15s}
  .share a:hover{background:#03bf9e;border-color:#03bf9e;color:#fff}
  .share svg{width:18px;height:18px}
  .detail-article p{margin:0 0 18px;line-height:1.8;color:#333;font-size:16px}
  .detail-article h3{margin:34px 0 12px;font-size:22px;color:#0d0d0d}
  .detail-article figure{margin:28px 0}
  .detail-article img{width:100%;border-radius:16px;display:block}
  .detail-article figcaption{margin-top:10px;color:var(--muted);font-size:14px;text-align:center}
  @media(max-width:820px){.detail-card{grid-template-columns:1fr}.detail-info{padding:30px 28px}}
</style>
</head>
<body>
<div id="site-nav"></div>

<section class="detail-hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-wash"></div>
  <div class="wrap">
    <div class="detail-card">
      <img class="poster" id="dImg" alt="">
      <div class="detail-info">
        <div id="dTag"></div>
        <h1 id="dTitle"></h1>
        <div id="dMeta"></div>
      </div>
    </div>
  </div>
</section>

<section class="pad" style="background:#fff">
  <div class="wrap">
    <div class="detail-content">
      <div class="detail-head">
        <h2>รายละเอียด</h2>
        <div class="share">Share :
          <a href="#" aria-label="แชร์ Facebook"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 22v-8h2.7l.4-3H13V9.2c0-.86.3-1.45 1.55-1.45H16.2V5.1C15.83 5.05 14.9 5 13.86 5 11.66 5 10.13 6.34 10.13 8.8V11H7.5v3h2.63v8H13z"/></svg></a>
          <a href="#" aria-label="แชร์ X"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.53 3h3.2l-6.99 7.99L22 21h-6.43l-5.03-6.58L4.78 21H1.58l7.48-8.55L2 3h6.6l4.55 6.01L17.53 3zm-1.12 16h1.77L7.67 4.9H5.77L16.41 19z"/></svg></a>
          <a href="#" aria-label="คัดลอกลิงก์"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9.5 14.5l5-5"/><path d="M11 6.5l1-1a4 4 0 0 1 5.7 5.7l-2 2"/><path d="M13 17.5l-1 1a4 4 0 0 1-5.7-5.7l2-2"/></svg></a>
        </div>
      </div>
      <div class="detail-article" id="dBody"></div>
      <div class="flex" style="margin-top:34px">
        <a class="btn ghost" href="around.html">← กลับไปหน้า What's Around SU</a>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="whatson-data.js"></script>
<script>
  (function(){
    var id = parseInt((new URLSearchParams(location.search)).get('id'), 10);
    var ev = AROUND.filter(function(e){return e.id===id;})[0] || AROUND[0];
    document.title = ev.title.replace(/[“”]/g,'') + ' · SUACC';
    document.getElementById('heroBg').style.backgroundImage = "url('"+ev.img+"')";
    document.getElementById('dImg').src = ev.img;
    var c = (window.WON_CAT_COLOR[ev.tag] || '#62d9c3');
    document.getElementById('dTag').innerHTML = '<span class="d-tag" style="background:'+c+'">'+ev.tag+'</span>';
    document.getElementById('dTitle').textContent = ev.title;

    /* meta: วันที่ + เวลา + ค่าเข้าชม + คณะที่จัด + สถานที่ */
    var I = window.WON_ICONS;
    document.getElementById('dMeta').innerHTML = '<ul class="won-meta">' +
      '<li>'+I.cal+'<span>'+ev.date+'</span></li>' +
      (ev.time ? '<li>'+I.clock+'<span>'+ev.time+'</span></li>' : '') +
      (ev.fee ? '<li>'+I.fee+'<span>'+ev.fee+'</span></li>' : '') +
      (ev.faculty ? '<li>'+I.fac+'<span>'+ev.faculty+'</span></li>' : '') +
      '<li>'+I.pin+'<span>'+ev.place+'</span></li>' +
    '</ul>';

    /* เนื้อหา: desc (+ เนื้อหาตัวอย่างเดโม่ ต่อท้ายเหมือนหน้าอื่น) */
    var html = '';
    if(ev.body && ev.body.length){
      html = ev.body.map(function(b){
        if(b.type==='h') return '<h3>'+b.text+'</h3>';
        if(b.type==='img') return '<figure><img src="'+b.src+'" alt="'+(b.cap||'')+'">'+(b.cap?'<figcaption>'+b.cap+'</figcaption>':'')+'</figure>';
        return '<p>'+b.text+'</p>';
      }).join('');
    } else {
      html = (ev.desc||[]).map(function(p){return '<p>'+p+'</p>';}).join('');
      if(window.WON_OVERVIEW_DEMO) html += window.WON_OVERVIEW_DEMO.map(function(p){return '<p>'+p+'</p>';}).join('');
    }
    document.getElementById('dBody').innerHTML = html;
  })();
</script>
<script src="site.js"></script>
</body>
</html>
