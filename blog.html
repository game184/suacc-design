<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog · SUACC</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* บทความเด่น — slider */
  .feat-slider{position:relative}
  .feat-viewport{overflow:hidden;border-radius:var(--radius)}
  .feat-track{display:flex;transition:transform .5s ease}
  .feat-slide{min-width:100%;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:34px;padding:24px;text-decoration:none;color:inherit;background:#fff}
  .feat-img{aspect-ratio:4/3;background-size:cover;background-position:center;background-color:#eee;border-radius:16px}
  .feat-body{padding:38px 42px;display:flex;flex-direction:column;justify-content:center}
  .feat-title{margin:6px 0 12px;font-family:'Silpakorn72','IBM Plex Sans Thai',sans-serif;font-size:clamp(22px,2.3vw,30px);line-height:1.3;color:#0d0d0d}
  .feat-ex{margin:0 0 14px;color:#555;line-height:1.7;font-size:16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .feat-meta{margin:0;color:var(--muted);font-size:14px;font-weight:600}
  .feat-btn{align-self:flex-start;margin-top:20px}
  .feat-nav{display:none}
  .feat-nav:hover{background:#03bf9e;color:#fff}
  .feat-nav.prev{left:14px}
  .feat-nav.next{right:14px}
  .feat-dots{display:flex;gap:9px;justify-content:center;margin-top:18px}
  .feat-dots button{width:9px;height:9px;border-radius:50%;border:none;background:#cfcfcf;cursor:pointer;padding:0;transition:.15s}
  .feat-dots button.on{background:#03bf9e;width:26px;border-radius:6px}
  @media(max-width:820px){.feat-slide{grid-template-columns:1fr}.feat-body{padding:28px 24px}.feat-nav{display:none}}
</style>
</head>
<body>
<div id="site-nav"></div>

<!-- intro -->
<section class="pad-s rc-page-banner">
  <div class="wrap">
    <p class="breadcrumb"><a href="reading.html">Reading Corner</a> › <b>Blog</b></p>
    <p class="eyebrow">Blog</p>
    <h1 class="mb0">บทความ &amp; เรื่องเล่าจากสำนักฯ</h1>
    <p class="lead" style="margin-top:14px">รวมบทความและเรื่องเล่าจากสำนักศิลปวัฒนธรรมและการสร้างสรรค์ฯ ชวนมองศิลปะและวัฒนธรรมผ่านมุมมองใหม่</p>
  </div>
</section>

<!-- บทความเด่น (slider · ดึงบทความที่ติ๊ก featured — แยกจาก highlight หน้าแรก) -->
<section class="pad alt" id="featSec">
  <div class="wrap">
    <div class="feat-slider" id="featSlider">
      <button class="feat-nav prev" type="button" aria-label="ก่อนหน้า">&#8249;</button>
      <div class="feat-viewport"><div class="feat-track" id="featTrack"></div></div>
      <button class="feat-nav next" type="button" aria-label="ถัดไป">&#8250;</button>
    </div>
    <div class="feat-dots" id="featDots" aria-label="เลือกสไลด์"></div>
  </div>
</section>

<!-- all articles -->
<section class="pad">
  <div class="wrap">
    <h2>บทความทั้งหมด</h2>
    <div class="chips">
      <span class="chip on">ทั้งหมด</span>
      <span class="chip">ศิลปะ</span>
      <span class="chip">วัฒนธรรม</span>
      <span class="chip">บทสัมภาษณ์</span>
      <span class="chip">เบื้องหลัง</span>
    </div>
    <div class="grid g3" id="blogAllGrid"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="whatson-data.js"></script>
<script>
  /* บทความทั้งหมด — render จาก BLOG ด้วยดีไซน์การ์ด blog (story-card) */
  (function(){
    var g=document.getElementById('blogAllGrid'); if(!g || !window.BLOG) return;
    g.innerHTML = BLOG.map(function(b){ return blogListCardHTML(b); }).join('');
  })();

  /* บทความเด่น — slider (ดึงบทความที่ติ๊ก featured) */
  (function(){
    var track=document.getElementById('featTrack'),
        slider=document.getElementById('featSlider'),
        dotsC=document.getElementById('featDots'),
        sec=document.getElementById('featSec');
    if(!track || !window.BLOG) return;
    var feats = BLOG.filter(function(b){ return b.featured; });
    if(!feats.length){ sec.style.display='none'; return; }
    track.innerHTML = feats.map(function(b){ return featuredSlideHTML(b); }).join('');
    var n=feats.length, i=0, timer=null;
    var prev=slider.querySelector('.feat-nav.prev'), next=slider.querySelector('.feat-nav.next');
    dotsC.innerHTML = feats.map(function(_,k){ return '<button type="button" data-k="'+k+'" aria-label="สไลด์ '+(k+1)+'"></button>'; }).join('');
    var dots=[].slice.call(dotsC.children);
    function go(k){ i=(k+n)%n; track.style.transform='translateX(-'+(i*100)+'%)'; dots.forEach(function(d,x){ d.classList.toggle('on', x===i); }); }
    prev.onclick=function(){ go(i-1); };
    next.onclick=function(){ go(i+1); };
    dots.forEach(function(d){ d.onclick=function(){ go(+d.dataset.k); }; });
    if(n<=1){ prev.style.display=next.style.display='none'; dotsC.style.display='none'; }
    go(0);
    function start(){ if(n>1 && !timer) timer=setInterval(function(){ go(i+1); }, 6000); }
    function stop(){ clearInterval(timer); timer=null; }
    slider.addEventListener('mouseenter', stop);
    slider.addEventListener('mouseleave', start);
    start();
  })();
</script>
<script src="site.js"></script>
</body>
</html>
