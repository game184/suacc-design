<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What we do — Portfolio · SUACC</title>
<link rel="stylesheet" href="styles.css">
<style>
/* การ์ดผลงาน = .work-grid/.work-card ใน styles.css (ดีไซน์เดียวกับ About › What we do) */
/* ปุ่มกรอง = สีหมวดเดียวกับหน้า What's On (ขอบสีหมวด · เลือกแล้วพื้นสีหมวด ตัวหนังสือเข้มโทนเดียวกัน) */
#pfChips .chip[style*="--cat"]{border-color:var(--cat)}
#pfChips .chip[style*="--cat"].on{background:var(--cat);color:var(--ink);border-color:var(--cat)}
</style>
</head>
<body>
<div id="site-nav"></div>

<!-- Header -->
<section class="pad tint">
  <div class="wrap">
    <p class="breadcrumb"><a href="index.html">หน้าแรก</a> / <a href="about.html">เกี่ยวกับเรา</a> / <b>What we do — ผลงาน</b></p>
    <p class="eyebrow">What we do</p>
    <h1 class="mb0">ผลงานของสำนักฯ</h1>
  </div>
</section>

<!-- Portfolio -->
<section class="pad alt">
  <div class="wrap">
    <!-- ข้อมูลจาก What's On (whatson-data.js) — ปุ่มกรองสร้างจากประเภทที่มีจริง -->
    <div class="chips" id="pfChips" role="group" aria-label="กรองตามประเภทผลงาน"></div>
    <div class="work-grid" id="pfGrid"></div>
  </div>
</section>

<!-- CTA -->
<section class="pad-s tint">
  <div class="wrap center">
    <p class="eyebrow">Connect with us</p>
    <h2>สนใจร่วมโครงการกับสำนักฯ?</h2>
    <div class="flex" style="justify-content:center;margin-top:8px">
      <a class="btn primary lg" href="contact.html">ติดต่อเรา</a>
      <a class="btn ghost lg" href="whatson.html">กิจกรรมที่กำลังจะมาถึง</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="whatson-data.js"></script>
<script src="site.js"></script>
<script>
/* ผลงานของสำนักฯ = window.workItems() (What's On + ลงข้อมูลเอง) · cover = ev.img · ลิงก์ไปหน้ารายละเอียด
   ระบบจริง: query What's On จาก CMS — เพิ่มกิจกรรมใน What's On แล้วขึ้นหน้านี้เอง */
(function(){
  var grid=document.getElementById('pfGrid'), chipBox=document.getElementById('pfChips');
  var list=window.workItems(), cats=[];
  /* สีตัวหนังสือบนปุ่มที่เลือก — ชุดเดียวกับ whatson.html */
  var CAT_INK={'นิทรรศการ':'#0c2e29','เสวนา':'#0c2233','Workshop':'#3a2c0e','ประกวด':'#5e211c','การแสดง':'#2e1a45','เทศกาล':'#4a2607'};
  grid.innerHTML=list.map(function(it){
    if(cats.indexOf(it.ev.tag)<0) cats.push(it.ev.tag);
    return window.workCardHTML(it);
  }).join('');
  chipBox.innerHTML=[''].concat(cats).map(function(c,i){
    var st=c?' style="--cat:'+(window.WON_CAT_COLOR[c]||'#62d9c3')+';--ink:'+(CAT_INK[c]||'#0c2e29')+'"':'';
    return '<button type="button" class="chip'+(i?'':' on')+'" data-f="'+c+'" aria-pressed="'+(!i)+'"'+st+'>'+(c||'ทั้งหมด')+'</button>';
  }).join('');
  var chips=chipBox.querySelectorAll('.chip');
  chips.forEach(function(c){ c.addEventListener('click',function(){
    var f=c.dataset.f;
    chips.forEach(function(x){ var on=x===c; x.classList.toggle('on',on); x.setAttribute('aria-pressed',on); });
    grid.querySelectorAll('.work-card').forEach(function(card){ card.hidden = !!f && card.dataset.cat!==f; });
  }); });
})();
</script>
</body>
</html>
