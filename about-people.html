<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>บุคลากร · SUACC</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-nav"></div>

<!-- Header -->
<section class="pad tint">
  <div class="wrap">
    <p class="breadcrumb"><a href="index.html">หน้าแรก</a> / <a href="about.html">เกี่ยวกับเรา</a> / <b>บุคลากร</b></p>
    <p class="eyebrow">Our People</p>
    <h1 class="mb0">บุคลากรของสำนักฯ</h1>
    <p class="lead" style="margin-top:16px">ทีมงานผู้ขับเคลื่อนพันธกิจด้านศิลปวัฒนธรรมและการสร้างสรรค์ ของมหาวิทยาลัยศิลปากร</p>
  </div>
</section>

<!-- กลุ่มบุคลากร (สร้างตามโครงสร้างสำนักฯ) -->
<div id="people"></div>

<div id="site-footer"></div>
<script src="site.js"></script>
<script>
/* โครงสร้างบุคลากรสำนักศิลปวัฒนธรรมและการสร้างสรรค์ แห่งมหาวิทยาลัยศิลปากร
   จำนวนตามเอกสารของสำนักฯ — รายชื่อ/ตำแหน่ง/ภาพ รอข้อมูลจริง */
var GROUPS = [
  { en:'Leadership',   th:'ผู้บริหาร',                              count:4  },
  { en:'Office',       th:'สำนักงานสำนักศิลปวัฒนธรรมฯ',             count:13 },
  { en:'Art Centre',   th:'หอศิลป์ มหาวิทยาลัยศิลปากร',             count:11 },
  { en:'Institute',    th:'สถาบันศิลปสถาปัตยกรรมเฉลิมพระเกียรติ',   count:2  }
];

var root = document.getElementById('people');
GROUPS.forEach(function(g, gi){
  var sec = document.createElement('section');
  // สลับพื้นหลัง: กลุ่มลำดับคู่ (0,2) = alt
  sec.className = 'pad' + (gi % 2 === 0 ? ' alt' : '');

  var cards = '';
  for (var i = 0; i < g.count; i++){
    cards +=
      '<div class="person">' +
        '<div class="pic"><img src="img/team/placeholder.svg" alt="บุคลากร ' + g.th + '" loading="lazy"></div>' +
        '<h4>ชื่อ–นามสกุล</h4>' +
        '<p class="role">ตำแหน่ง</p>' +
      '</div>';
  }

  sec.innerHTML =
    '<div class="wrap">' +
      '<div class="shead">' +
        '<div><p class="eyebrow">' + g.en + '</p>' +
        '<h2 class="mb0">' + g.th + ' <span style="font-weight:400;color:var(--muted);font-size:.62em">(' + g.count + ' คน)</span></h2></div>' +
      '</div>' +
      '<div class="grid g4">' + cards + '</div>' +
    '</div>';
  root.appendChild(sec);
});
</script>
</body>
</html>
