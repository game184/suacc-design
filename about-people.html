<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>บุคลากร · SUACC</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="site-nav"></div>

<!-- Header -->
<section class="pad tint">
  <div class="wrap">
    <p class="breadcrumb"><a href="index.html">หน้าแรก</a> / <a href="about.html">เกี่ยวกับเรา</a> / <b>บุคลากร</b></p>
    <p class="eyebrow">Our People</p>
    <h1 class="mb0">บุคลากรของสำนักฯ</h1>
  </div>
</section>

<!-- กลุ่มบุคลากร (สร้างตามโครงสร้างสำนักฯ) -->
<div id="people"></div>

<div id="site-footer"></div>
<script src="site.js"></script>
<script>
/* โครงสร้างบุคลากรสำนักศิลปวัฒนธรรมและการสร้างสรรค์ แห่งมหาวิทยาลัยศิลปากร
   จำนวนตามเอกสารของสำนักฯ — รายชื่อ/ตำแหน่ง/ภาพ รอข้อมูลจริง */
var GROUPS = [
  { th:'ผู้บริหาร',                                 count:4,  logo:'img/logo-suacc.png'     },
  { th:'สำนักงานสำนักศิลปวัฒนธรรมและการสร้างสรรค์',  count:13, logo:'img/logo-suacc.png'     },
  { th:'หอศิลป์ มหาวิทยาลัยศิลปากร',                 count:11, logo:'img/logo-artcentre.png' },
  { th:'สถาบันศิลปสถาปัตยกรรมไทยเฉลิมพระเกียรติ',    count:2,  logo:'img/logo-institute.png' }
];

function pad2(n){ return (n < 10 ? '0' : '') + n; }
var faceIdx = 0;               // วนใช้ภาพ portrait สมมุติ team-01..12
var root = document.getElementById('people');
GROUPS.forEach(function(g, gi){
  var sec = document.createElement('section');
  // สลับพื้นหลัง: กลุ่มลำดับคู่ (0,2) = alt
  sec.className = 'pad' + (gi % 2 === 0 ? ' alt' : '');

  var cards = '';
  for (var i = 0; i < g.count; i++){
    var face = 'img/team/team-' + pad2((faceIdx % 12) + 1) + '.jpg';
    faceIdx++;
    cards +=
      '<div class="person">' +
        '<div class="pic"><img src="' + face + '" alt="บุคลากร ' + g.th + '" loading="lazy"></div>' +
        '<h4>ชื่อ–นามสกุล</h4>' +
        '<p class="role">ตำแหน่ง</p>' +
      '</div>';
  }

  sec.innerHTML =
    '<div class="wrap">' +
      '<div class="shead">' +
        '<div><h2 class="mb0">' + g.th + '</h2></div>' +
      '</div>' +
      '<div class="grid g4">' + cards + '</div>' +
    '</div>';
  root.appendChild(sec);
});
</script>
</body>
</html>
