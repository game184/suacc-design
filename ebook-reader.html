<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>อ่าน E-Book · SUACC</title>
<link rel="stylesheet" href="styles.css">
<style>
  .reader-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .reader-head h1{margin:0;font-size:clamp(22px,2.4vw,30px)}
  .reader-head .by{color:var(--muted);margin:4px 0 0;font-size:15px}
  .reader-stage{background:#1c1c1c;border-radius:var(--radius);padding:22px}
  .reader-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#cfcfcf;font-size:13px}
  .reader-page{background:#fff;color:#333;aspect-ratio:3/4;max-width:560px;margin:16px auto;border-radius:6px;
    display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;
    background-size:cover;background-position:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .reader-nav{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:6px}
  .reader-nav button{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:30px;padding:9px 22px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
  .reader-nav button:hover:not(:disabled){background:#03bf9e;border-color:#03bf9e;color:#04140f}
  .reader-nav button:disabled{opacity:.4;cursor:not-allowed}
  .reader-nav .pg{color:#cfcfcf;font-size:14px;min-width:80px;text-align:center}
</style>
</head>
<body>
<div id="site-nav"></div>

<section class="pad">
  <div class="wrap">
    <p class="breadcrumb"><a href="reading.html">Reading Corner</a> › <a href="ebooks.html">E-Books</a> › <b id="rBc">อ่าน</b></p>
    <div class="reader-head">
      <div>
        <h1 id="rTitle">—</h1>
        <p class="by" id="rBy"></p>
      </div>
      <a class="btn ghost" href="ebooks.html">← กลับไปหน้า E-Books</a>
    </div>
    <div class="reader-stage">
      <div class="reader-bar">
        <span id="rBar"></span>
        <span class="no-dl">⛔ ดาวน์โหลดไม่ได้</span>
      </div>
      <div class="reader-page" id="rPage"></div>
      <div class="reader-nav">
        <button id="rPrev">‹ ก่อนหน้า</button>
        <span class="pg" id="rPg"></span>
        <button id="rNext">ถัดไป ›</button>
      </div>
    </div>
    <p class="center muted" style="margin-top:12px;font-size:13px">เปิดอ่านบนเว็บ — ระบบแสดงผลแบบป้องกันการดาวน์โหลด</p>
  </div>
</section>

<div id="site-footer"></div>
<script src="whatson-data.js"></script>
<script>
  (function(){
    var id=parseInt((new URLSearchParams(location.search)).get('id'),10);
    var e=(window.EBOOKS||[]).filter(function(x){return x.id===id;})[0] || (window.EBOOKS||[])[0];
    if(!e) return;
    var total=e.pages||48, cur=1;
    document.title=e.title.replace(/[“”]/g,'')+' · อ่าน E-Book';
    document.getElementById('rTitle').textContent=e.title;
    document.getElementById('rBc').textContent=e.title;
    document.getElementById('rBy').textContent=e.by||'';
    var page=document.getElementById('rPage'), bar=document.getElementById('rBar'),
        pg=document.getElementById('rPg'), prev=document.getElementById('rPrev'), next=document.getElementById('rNext');
    function draw(){
      if(cur===1){ page.style.backgroundImage="url('"+e.img+"')"; page.textContent=''; }
      else { page.style.backgroundImage='none'; page.textContent='หน้ากระดาษ PDF (ตัวอย่าง) — หน้า '+cur; }
      bar.textContent=e.title+' — หน้า '+cur+' / '+total;
      pg.textContent=cur+' / '+total;
      prev.disabled=cur<=1; next.disabled=cur>=total;
    }
    prev.onclick=function(){ if(cur>1){cur--;draw();} };
    next.onclick=function(){ if(cur<total){cur++;draw();} };
    draw();
  })();
</script>
<script src="site.js"></script>
</body>
</html>
