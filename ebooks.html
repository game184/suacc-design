<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Books · SUACC</title>
<link rel="stylesheet" href="styles.css">
<style>
  .eb-hero .eyebrow{font-family:'Silpakorn72','IBM Plex Sans Thai',sans-serif;font-size:24px;text-transform:none;letter-spacing:0;color:#0a7256;margin:0 0 10px}
  .eb-searchbar{display:flex;align-items:center;gap:10px;max-width:460px;margin:0 0 30px;
    border:1.5px solid var(--line);border-radius:30px;padding:11px 20px;background:#fff}
  .eb-searchbar svg{width:20px;height:20px;color:#8a8f96;flex-shrink:0}
  .eb-searchbar input{border:none;outline:none;flex:1;font:inherit;font-size:15px;color:#0d0d0d;background:transparent}
  .eb-empty{color:var(--muted);padding:30px 0}
</style>
</head>
<body>
<div id="site-nav"></div>

<!-- intro -->
<section class="pad-s rc-page-banner">
  <div class="wrap">
    <p class="breadcrumb"><a href="reading.html">Reading Corner</a> › <b>E-Books</b></p>
    <p class="eyebrow">E-Books</p>
    <h1 class="mb0">หนังสือ &amp; วารสารอิเล็กทรอนิกส์</h1>
    <p class="lead" style="margin-top:14px">วารสาร สูจิบัตร และหนังสือเผยแพร่ของสำนักฯ เปิดอ่านบนเว็บได้ทันที ไม่ต้องสมัครสมาชิก</p>
  </div>
</section>

<!-- grid + search -->
<section class="pad alt">
  <div class="wrap">
    <div class="eb-searchbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" id="ebSearch" placeholder="ค้นหาหนังสือ / ผู้แต่ง…" aria-label="ค้นหา E-Books">
    </div>
    <div class="eb-grid" id="ebGridAll"></div>
    <p class="eb-empty" id="ebEmpty" style="display:none">ไม่พบหนังสือที่ตรงกับคำค้น</p>
  </div>
</section>

<div id="site-footer"></div>
<script src="whatson-data.js"></script>
<script>
  /* E-Books — render + ค้นหา · คลิกเปิดหน้าอ่าน ebook-reader.html */
  (function(){
    var g=document.getElementById('ebGridAll'),
        input=document.getElementById('ebSearch'),
        empty=document.getElementById('ebEmpty');
    if(!g || !window.EBOOKS) return;
    function render(q){
      q=(q||'').trim().toLowerCase();
      var list=EBOOKS.filter(function(e){
        return !q || e.title.toLowerCase().indexOf(q)>=0 || (e.by||'').toLowerCase().indexOf(q)>=0;
      });
      g.innerHTML = list.map(function(e){ return ebookCardHTML(e, 'ebook-reader.html?id='+e.id); }).join('');
      empty.style.display = list.length ? 'none' : '';
    }
    render('');
    input.addEventListener('input', function(){ render(input.value); });
  })();
</script>
<script src="site.js"></script>
</body>
</html>
