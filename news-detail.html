<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ข่าวสาร · SUACC</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* ===== News detail — left-aligned + sidebar (ขอบตรงกับโลโก้ web) ===== */
  body{background:#fff}
  .nd-wrap{max-width:1680px;margin:0 auto;padding:36px 120px 20px}
  @media(max-width:1100px){.nd-wrap{padding:30px 48px 16px}}
  @media(max-width:600px){.nd-wrap{padding:26px 20px 16px}}
  /* header (ชิดซ้าย) */
  .nd-bc{font-size:14px;color:#7a7f87;margin:0 0 16px}
  .nd-bc a{color:var(--green-d)}
  .nd-title{font-family:var(--head);font-size:clamp(28px,3.6vw,42px);line-height:1.25;font-weight:700;color:#0d0d0d;margin:0 0 14px;max-width:1000px}
  .nd-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:#7a7f87;font-size:14.5px;padding-bottom:26px;border-bottom:1px solid var(--line)}
  .nd-meta .ic{width:18px;height:18px;color:var(--green-d)}
  /* layout */
  .nd-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:60px;padding:34px 0 10px;align-items:start}
  /* main column */
  .nd-hero{margin:0 0 34px}
  .nd-hero img{width:100%;height:auto;max-height:560px;object-fit:cover;display:block;border-radius:14px}
  .nd-body p{margin:0 0 22px;font-size:18px;line-height:1.95;color:#2a2d31}
  .nd-body p.lead{font-size:20px;line-height:1.85;color:#0d0d0d;font-weight:600}
  .nd-body h3{font-family:var(--head);font-size:24px;line-height:1.4;margin:40px 0 14px;color:#0d0d0d}
  /* bottom tag + share bar (ล่างสุด) */
  .nd-foot{margin-top:46px;padding-top:26px;border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap}
  .nd-foot .lbl{font-size:13.5px;color:#7a7f87;margin-right:8px}
  .nd-tagwrap,.nd-share{display:flex;align-items:center;gap:10px}
  .nd-cat{display:inline-block;font-family:var(--head);font-size:13.5px;font-weight:700;letter-spacing:.06em;
    color:var(--green-d);background:#eafaf6;border:1px solid rgba(3,191,158,.22);border-radius:999px;padding:8px 20px}
  .nd-share a{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:#0d0d0d;background:#fff;transition:.15s}
  .nd-share a:hover{background:var(--green-d);border-color:var(--green-d);color:#fff}
  .nd-share svg{width:18px;height:18px}
  .nd-back{margin-top:30px}
  /* sidebar — ข่าวที่เกี่ยวข้อง */
  .nd-side{position:sticky;top:92px}
  .nd-card{background:#f7faf9;border:1px solid var(--line);border-radius:16px;padding:22px 24px}
  .nd-card h4{font-family:var(--head);font-size:18px;color:var(--green-d);margin:0 0 14px;padding-bottom:12px;border-bottom:2px solid var(--green)}
  .rel-list{display:flex;flex-direction:column;gap:4px}
  .rel-item{display:flex;gap:13px;align-items:center;padding:12px 0;border-bottom:1px solid #e9efec;text-decoration:none;transition:.15s}
  .rel-item:last-child{border-bottom:none}
  .rel-item .th{width:70px;height:70px;border-radius:10px;background-size:cover;background-position:center;flex-shrink:0}
  .rel-item .rt{font-weight:600;font-size:14.5px;line-height:1.45;color:#0d0d0d;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rel-item .rd{display:block;font-size:12.5px;color:#7a7f87;margin-top:5px}
  .rel-item:hover .rt{color:var(--green-d)}
  @media(max-width:900px){
    .nd-grid{grid-template-columns:1fr;gap:34px}
    .nd-side{position:static}
  }
  @media(max-width:640px){.nd-body p{font-size:17px}.nd-body p.lead{font-size:18.5px}.nd-foot{gap:16px}}
</style>
</head>
<body>
<div id="site-nav"></div>

<main id="maincontent" tabindex="-1">
<div class="nd-wrap">

  <!-- header (ชิดซ้าย) -->
  <p class="nd-bc"><a href="index.html">หน้าแรก</a> / <a href="about-news.html">ข่าวสารและประกาศ</a></p>
  <h1 class="nd-title" id="dTitle"></h1>
  <div class="nd-meta">
    <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg></span>
    <span id="dDate"></span>
  </div>

  <!-- 2 คอลัมน์ -->
  <div class="nd-grid">

    <!-- บทความ -->
    <article class="nd-main">
      <figure class="nd-hero"><img id="dHero" alt=""></figure>
      <div class="nd-body" id="dBody"></div>

      <!-- Tag + share (ล่างสุด) -->
      <div class="nd-foot">
        <div class="nd-tagwrap"><span class="lbl">หมวดหมู่</span><span class="nd-cat" id="dCat"></span></div>
        <div class="nd-share"><span class="lbl">แชร์</span>
          <a href="#" aria-label="แชร์ Facebook" onclick="return false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 22v-8h2.7l.4-3H13V9.2c0-.86.3-1.45 1.55-1.45H16.2V5.1C15.83 5.05 14.9 5 13.86 5 11.66 5 10.13 6.34 10.13 8.8V11H7.5v3h2.63v8H13z"/></svg></a>
          <a href="#" aria-label="แชร์ X" onclick="return false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.53 3h3.2l-6.99 7.99L22 21h-6.43l-5.03-6.58L4.78 21H1.58l7.48-8.55L2 3h6.6l4.55 6.01L17.53 3zm-1.12 16h1.77L7.67 4.9H5.77L16.41 19z"/></svg></a>
          <a href="#" aria-label="แชร์ Line" onclick="return false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9.3.07.76.22.87.5.1.26.07.66.03.92l-.14.85c-.04.26-.2 1 .88.55 1.08-.46 5.8-3.42 7.9-5.85C21.3 14.5 22 12.9 22 11c0-4.4-4.5-8-10-8zM8.1 13.3H6.1a.53.53 0 0 1-.53-.53V9.3a.53.53 0 0 1 1.06 0v2.94H8.1a.53.53 0 0 1 0 1.06zm2.1-.53a.53.53 0 0 1-1.06 0V9.3a.53.53 0 0 1 1.06 0zm4.3 0a.53.53 0 0 1-.37.5.5.5 0 0 1-.6-.18l-2-2.7v2.38a.53.53 0 0 1-1.06 0V9.3a.53.53 0 0 1 .95-.32l2.02 2.7V9.3a.53.53 0 0 1 1.06 0zm3.3-2.47a.53.53 0 0 1 0 1.06h-1.4v.88h1.4a.53.53 0 0 1 0 1.06h-1.94a.53.53 0 0 1-.53-.53V9.3a.53.53 0 0 1 .53-.53h1.94a.53.53 0 0 1 0 1.06h-1.4v.88z"/></svg></a>
          <a href="#" aria-label="คัดลอกลิงก์" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href);return false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9.5 14.5l5-5"/><path d="M11 6.5l1-1a4 4 0 0 1 5.7 5.7l-2 2"/><path d="M13 17.5l-1 1a4 4 0 0 1-5.7-5.7l2-2"/></svg></a>
        </div>
      </div>

      <div class="nd-back"><a class="btn ghost" href="about-news.html">← กลับไปหน้าข่าวสาร</a></div>
    </article>

    <!-- sidebar -->
    <aside class="nd-side">
      <div class="nd-card">
        <h4>ข่าวที่เกี่ยวข้อง</h4>
        <div class="rel-list" id="dMore"></div>
      </div>
    </aside>

  </div>
</div>
</main>

<div id="site-footer"></div>
<script>
/* ข้อมูลข่าว (mock) — ให้ตรงกับการ์ดในหน้า about-news.html · ระบบจริงดึงจาก CMS ตาม id */
window.NEWS = [
  {id:1,  tag:'กิจกรรม', date:'18 ก.ย. 2569', img:'img/cosmology-02.jpg',
    title:'เปิดนิทรรศการศิลปกรรมแห่งชาติ ครั้งที่ 69 ณ หอศิลป์ มหาวิทยาลัยศิลปากร',
    lead:'สำนักศิลปวัฒนธรรมและการสร้างสรรค์ มหาวิทยาลัยศิลปากร จัดพิธีเปิดนิทรรศการศิลปกรรมแห่งชาติ ครั้งที่ 69 อย่างเป็นทางการ ณ หอศิลป์ มหาวิทยาลัยศิลปากร'},
  {id:2,  tag:'รับสมัคร', date:'16 ก.ย. 2569', img:'img/coll-14.jpg',
    title:'ประกาศรับสมัครเจ้าหน้าที่ภัณฑารักษ์ประจำหอศิลป์ มหาวิทยาลัยศิลปากร',
    lead:'สำนักฯ เปิดรับสมัครบุคคลเพื่อคัดเลือกเป็นเจ้าหน้าที่ภัณฑารักษ์ (Curator) ประจำหอศิลป์ มหาวิทยาลัยศิลปากร จำนวน 1 อัตรา'},
  {id:3,  tag:'ประกาศ', date:'12 ก.ย. 2569', img:'img/coll-22.jpg',
    title:'ประกาศวันหยุดทำการหอศิลป์ มหาวิทยาลัยศิลปากร ช่วงเทศกาล ประจำปี 2569',
    lead:'หอศิลป์ มหาวิทยาลัยศิลปากร แจ้งกำหนดวันหยุดทำการในช่วงเทศกาล ประจำปี 2569 เพื่อให้ผู้เข้าชมวางแผนการเดินทางล่วงหน้า'},
  {id:4,  tag:'กิจกรรม', date:'5 ก.ย. 2569', img:'img/coll-30.jpg',
    title:'สำนักฯ ร่วมจัดเทศกาลศิลปะร่วมสมัยเมืองเก่า 2569',
    lead:'สำนักศิลปวัฒนธรรมและการสร้างสรรค์ ร่วมเป็นเจ้าภาพจัดเทศกาลศิลปะร่วมสมัยในย่านเมืองเก่า เชื่อมโยงศิลปิน ชุมชน และพื้นที่ทางวัฒนธรรม'},
  {id:5,  tag:'ประกาศ', date:'1 ก.ย. 2569', img:'img/coll-griffin.jpg',
    title:'ประกาศเชิญชวนส่งผลงานเข้าประกวดศิลปกรรมร่วมสมัย ประจำปี 2569',
    lead:'สำนักฯ ขอเชิญชวนศิลปินและผู้สนใจส่งผลงานเข้าร่วมการประกวดศิลปกรรมร่วมสมัย ประจำปี 2569 ชิงเงินรางวัลและเกียรติบัตร'},
  {id:6,  tag:'กิจกรรม', date:'22 ส.ค. 2569', img:'img/coll-25.jpg',
    title:'เปิดตัวคลังสะสมศิลปกรรมออนไลน์ เชื่อมระบบหอสมุดกลาง',
    lead:'สำนักฯ เปิดตัวระบบคลังสะสมศิลปกรรมออนไลน์ (Digital Collection) ให้ผู้สนใจสืบค้นและเข้าถึงผลงานสะสมได้จากทุกที่'},
  {id:7,  tag:'ประกาศ', date:'20 ส.ค. 2569', img:'img/coll-28.jpg',
    title:'ประกาศนโยบายการคุ้มครองข้อมูลส่วนบุคคล (PDPA) ของสำนักฯ',
    lead:'สำนักฯ ประกาศนโยบายและแนวปฏิบัติในการคุ้มครองข้อมูลส่วนบุคคล ตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562'},
  {id:8,  tag:'กิจกรรม', date:'10 ส.ค. 2569', img:'img/cosmology-03.jpg',
    title:'ขอเชิญร่วมเวิร์กช็อปภาพพิมพ์สำหรับบุคคลทั่วไป ณ หอศิลป์',
    lead:'สำนักฯ จัดกิจกรรมเวิร์กช็อปภาพพิมพ์ (Printmaking Workshop) สำหรับบุคคลทั่วไป โดยไม่มีค่าใช้จ่าย รับจำนวนจำกัด'},
  {id:9,  tag:'บุคลากร', date:'20 ต.ค. 2568', img:'img/coll-19.jpg',
    title:'เผยแพร่แผนการบริหารและพัฒนาทรัพยากรบุคคล ประจำปี 2569',
    lead:'สำนักฯ เผยแพร่แผนการบริหารและพัฒนาทรัพยากรบุคคล ประจำปีงบประมาณ พ.ศ. 2569 เพื่อความโปร่งใสและการมีส่วนร่วม'},
  {id:10, tag:'บุคลากร', date:'20 ต.ค. 2568', img:'img/coll-21.jpg',
    title:'ประกาศหลักเกณฑ์การบริหารและพัฒนาทรัพยากรบุคคลของสำนักฯ',
    lead:'สำนักฯ ประกาศหลักเกณฑ์และแนวทางการบริหารและพัฒนาทรัพยากรบุคคล เพื่อใช้เป็นกรอบในการดำเนินงานด้านบุคลากร'}
];

(function(){
  var NEWS = window.NEWS;
  var id = parseInt((new URLSearchParams(location.search)).get('id'), 10);
  var ev = NEWS.filter(function(e){return e.id===id;})[0] || NEWS[0];

  document.title = ev.title + ' · SUACC';
  document.getElementById('dTitle').textContent = ev.title;
  document.getElementById('dDate').textContent = 'เผยแพร่เมื่อ ' + ev.date;
  document.getElementById('dCat').textContent = ev.tag;
  var hero = document.getElementById('dHero');
  hero.src = ev.img; hero.alt = ev.title;

  document.getElementById('dBody').innerHTML =
    '<p class="lead">' + ev.lead + '</p>' +
    '<p>สำนักศิลปวัฒนธรรมและการสร้างสรรค์ มหาวิทยาลัยศิลปากร มุ่งส่งเสริม อนุรักษ์ และเผยแพร่งานศิลปวัฒนธรรม ควบคู่กับการสร้างสรรค์ผลงานใหม่ เพื่อเป็นแหล่งเรียนรู้แก่นักศึกษา บุคลากร และประชาชนทั่วไป</p>' +
    '<h3>รายละเอียดเพิ่มเติม</h3>' +
    '<p>ผู้สนใจสามารถติดตามข้อมูลข่าวสาร กำหนดการ และรายละเอียดเพิ่มเติมได้ทางเว็บไซต์และช่องทางประชาสัมพันธ์ของสำนักฯ หรือสอบถามโดยตรงที่สำนักงานสำนักศิลปวัฒนธรรมและการสร้างสรรค์ ในวันและเวลาราชการ</p>' +
    '<p>ทั้งนี้ สำนักฯ ขอขอบคุณทุกภาคส่วนที่ร่วมสนับสนุนการดำเนินงานด้านศิลปวัฒนธรรมและการสร้างสรรค์ของมหาวิทยาลัยศิลปากรด้วยดีเสมอมา</p>';

  // ข่าวที่เกี่ยวข้อง (4 รายการ)
  var more = NEWS.filter(function(e){return e.id!==ev.id;}).slice(0,4);
  document.getElementById('dMore').innerHTML = more.map(function(e){
    return '<a class="rel-item" href="news-detail.html?id='+e.id+'">'+
      '<span class="th" style="background-image:url(\''+e.img+'\')"></span>'+
      '<span><span class="rt">'+e.title+'</span><span class="rd">'+e.date+'</span></span></a>';
  }).join('');
})();
</script>
<script src="site.js"></script>
</body>
</html>
