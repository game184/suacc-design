<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายละเอียดกิจกรรม · SUACC</title>
<link rel="stylesheet" href="styles.css">
<style>
  html{scroll-behavior:smooth}
  /* ===== Banner เต็มกว้าง (banner-whaton) ===== */
  .d2-hero{width:100%;background:#0d0d0d;line-height:0}
  .d2-hero img{width:100%;display:block;aspect-ratio:1366/637;object-fit:cover}
  /* ===== แถวบน: กลับ + Share ===== */
  .d2-top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0 8px}
  .d2-back{display:inline-flex;align-items:center;gap:8px;color:#0a7256;font-weight:700;text-decoration:none}
  .d2-back:hover{color:#03bf9e}
  .share{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:600;font-size:15px}
  .share a{display:flex;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);align-items:center;justify-content:center;color:#333;transition:.15s}
  .share a:hover{background:#03bf9e;border-color:#03bf9e;color:#fff}
  .share svg{width:17px;height:17px}
  /* ===== 2 คอลัมน์ ===== */
  .d2-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:50px;padding-bottom:70px}
  /* sticky head (ชื่อ + แท็บ) */
  .d2-head{position:sticky;top:var(--stick,135px);z-index:10;background:#fff;padding-top:20px}
  .d2-head h1{margin:0 0 16px;font-size:clamp(26px,2.8vw,38px);line-height:1.25}
  .d2-tabs{display:flex;gap:34px;border-bottom:2px solid #0d0d0d}
  .d2-tab{appearance:none;background:none;border:none;border-bottom:3px solid transparent;padding:12px 2px;margin-bottom:-2px;
    font-family:'Silpakorn72','IBM Plex Sans Thai',sans-serif;font-size:20px;font-weight:700;color:#9a9a9a;cursor:pointer;text-decoration:none;transition:.15s}
  .d2-tab:hover{color:#0d0d0d}
  .d2-tab.on{color:#0d0d0d;border-bottom-color:#03bf9e}
  /* เนื้อหา (เลื่อนอ่าน) */
  .d2-sec{padding-top:30px;scroll-margin-top:230px}
  .d2-sec+.d2-sec{padding-top:46px}
  .d2-sec h2.d2-sectitle{margin:0 0 26px;font-size:30px;font-weight:700;line-height:1.25;color:#0d0d0d;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .d2-sec h2{margin:0 0 18px;font-size:22px}
  .d2-sec p{margin:0 0 18px;line-height:1.85;color:#333;font-size:16px}
  .d2-sec h3{margin:30px 0 10px;font-size:20px;color:#0d0d0d}
  .d2-arts{display:grid;grid-template-columns:1fr 1fr;gap:36px 30px}
  .d2-art{margin:0}
  .d2-art img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block}
  /* รูปแทรกในเนื้อหา Overview */
  .ov-img{margin:26px 0}
  .ov-img img{width:100%;border-radius:14px;display:block}
  .ov-img figcaption{margin-top:10px;font-size:14px;color:#777;text-align:center;line-height:1.5}
  /* วิดีโอแทรกในเนื้อหา Overview */
  .ov-video{margin:26px 0}
  .ov-video-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
  .ov-video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .ov-video figcaption{margin-top:10px;font-size:14px;color:#777;text-align:center;line-height:1.5}
  .d2-art .cap{margin-top:14px}
  .d2-art h4{margin:0 0 4px;font-size:20px;color:#0d0d0d}
  .d2-art .by{display:block;color:#03bf9e;font-weight:700;font-size:14px;margin-bottom:8px}
  .d2-art p{margin:0;color:#444;font-size:15.5px;line-height:1.7}
  /* กล่องรายละเอียด (sticky · สีหมวด opacity ต่ำ) */
  .d2-side{position:relative}
  .d2-box{position:sticky;top:calc(var(--stick,135px) + 16px);border-radius:18px;padding:10px 26px}
  .d2-box .won-meta{gap:0;margin:0}
  .d2-box .won-meta li{padding:18px 0;border-bottom:1px solid rgba(0,0,0,.12);font-size:17px;color:#0d0d0d;font-weight:600;align-items:center}
  .d2-box .won-meta li:last-child{border-bottom:none}
  .d2-box .won-meta svg{width:24px;height:24px;color:#0d0d0d;margin-top:0}
  .d2-box .won-meta .free{color:#0d0d0d}
  @media(max-width:900px){
    .d2-grid{grid-template-columns:1fr;gap:30px;min-height:auto}
    .d2-head{position:static;top:auto}
    .d2-box{position:static}
    .d2-sec{scroll-margin-top:140px}
    .d2-arts{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="site-nav"></div>

<section class="d2-hero"><img id="dBanner" alt=""></section>

<section class="pad" style="padding-top:0;background:#fff">
  <div class="wrap">
    <div class="d2-top">
      <a class="d2-back" href="whatson.html">← กลับ</a>
      <div class="share">Share :
        <a href="#" aria-label="แชร์ Facebook"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 22v-8h2.7l.4-3H13V9.2c0-.86.3-1.45 1.55-1.45H16.2V5.1C15.83 5.05 14.9 5 13.86 5 11.66 5 10.13 6.34 10.13 8.8V11H7.5v3h2.63v8H13z"/></svg></a>
        <a href="#" aria-label="แชร์ X"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.53 3h3.2l-6.99 7.99L22 21h-6.43l-5.03-6.58L4.78 21H1.58l7.48-8.55L2 3h6.6l4.55 6.01L17.53 3zm-1.12 16h1.77L7.67 4.9H5.77L16.41 19z"/></svg></a>
        <a href="#" aria-label="คัดลอกลิงก์"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9.5 14.5l5-5"/><path d="M11 6.5l1-1a4 4 0 0 1 5.7 5.7l-2 2"/><path d="M13 17.5l-1 1a4 4 0 0 1-5.7-5.7l2-2"/></svg></a>
      </div>
    </div>

    <div class="d2-grid">
      <div class="d2-main">
        <div class="d2-head">
          <h1 id="dTitle"></h1>
          <nav class="d2-tabs" id="d2Tabs"></nav>
        </div>
        <div id="d2Sections"></div>
      </div>

      <aside class="d2-side">
        <div class="d2-box" id="dBox"></div>
      </aside>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="whatson-data.js"></script>
<script>
  (function(){
    /* template เดียวกันใช้ 2 ที่: What's On detail และ What we do detail (?from=work)
       What we do: ?id= = ผลงานจาก What's On · ?work= = ผลงานที่ลงเอง (WORKS) */
    var q = new URLSearchParams(location.search);
    var fromWork = q.get('from')==='work';
    var id = parseInt(q.get('id'), 10), wid = parseInt(q.get('work'), 10);
    var ev = (wid && (window.WORKS||[]).filter(function(e){return e.id===wid;})[0])
          || WHATSON.filter(function(e){return e.id===id;})[0] || WHATSON[0];
    if(fromWork) document.querySelector('.d2-back').href = 'about-portfolio.html';
    document.title = ev.title.replace(/[“”]/g,'') + ' · SUACC';

    /* banner = โปสเตอร์แนวนอน (landscape) ถ้ามี · ไม่มีใช้ bw-id · สุดท้าย fallback poster */
    var bImg = new Image();
    var bSrc = ev.banner || ('img/bw-'+ev.id+'.png');
    bImg.onload = function(){ document.getElementById('dBanner').src = bSrc; };
    bImg.onerror = function(){ document.getElementById('dBanner').src = ev.img; };
    bImg.src = bSrc;

    document.getElementById('dTitle').textContent = ev.title;

    /* กล่องรายละเอียด — สีหมวด opacity ต่ำ (ตัวอักษรชัด) */
    var cat = (window.WON_CAT_COLOR[ev.tag] || '#62d9c3');
    function tint(hex,a){ var n=parseInt(hex.slice(1),16); return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'; }
    var box = document.getElementById('dBox');
    box.style.background = tint(cat, 0.22);
    box.innerHTML = wonMetaHTML(ev);

    /* ----- เนื้อหาแต่ละแท็บ ----- */
    /* Overview = ข้อความ (body/desc · ไม่เอารูป) */
    var ovHtml = '';
    if(ev.body && ev.body.length){
      ovHtml = ev.body.map(function(b){
        if(b.type==='img') return '<figure class="ov-img"><img src="'+b.src+'" alt="'+(b.cap||'')+'" loading="lazy">'+(b.cap?'<figcaption>'+b.cap+'</figcaption>':'')+'</figure>';
        if(b.type==='video') return '<figure class="ov-video"><div class="ov-video-frame"><iframe src="https://www.youtube.com/embed/'+b.yt+'" title="'+(b.cap||'')+'" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>'+(b.cap?'<figcaption>'+b.cap+'</figcaption>':'')+'</figure>';
        return b.type==='h' ? '<h3>'+b.text+'</h3>' : '<p>'+b.text+'</p>';
      }).join('');
    } else if(ev.desc && ev.desc.length){
      ovHtml = ev.desc.map(function(p){return '<p>'+p+'</p>';}).join('');
      /* เติมเนื้อหาตัวอย่าง (เดโม่) ต่อท้าย Overview — อีเวนต์ที่ยังไม่มี body เต็ม (ทุกตัวยกเว้น id=2) */
      if(window.WON_OVERVIEW_DEMO) ovHtml += window.WON_OVERVIEW_DEMO.map(function(p){return '<p>'+p+'</p>';}).join('');
    }
    /* Highlight = artworks (รูป + คำบรรยาย) */
    var hlHtml = '';
    if(ev.artworks && ev.artworks.length){
      hlHtml = '<div class="d2-arts">' + ev.artworks.map(function(a){
        return '<figure class="d2-art"><img src="'+a.img+'" alt="'+a.title+'">'+
          '<figcaption class="cap"><h4>'+a.title+'</h4><span class="by">'+a.by+'</span><p>'+a.desc+'</p></figcaption></figure>';
      }).join('') + '</div>';
    }

    /* ----- รายการแท็บ (เพิ่มในอนาคตได้ที่นี่) · แสดงเฉพาะแท็บที่มีข้อมูล ----- */
    var SECTIONS = [
      {key:'sec-ov', label:'Overview',  html: ovHtml},
      {key:'sec-hl', label:'Highlight', html: hlHtml}
      /* เพิ่มแท็บใหม่: {key:'sec-xxx', label:'ชื่อแท็บ', html: '<เนื้อหา>'} */
    ].filter(function(s){ return s.html && s.html.trim(); });

    document.getElementById('d2Tabs').innerHTML = SECTIONS.map(function(s,i){
      return '<a class="d2-tab'+(i===0?' on':'')+'" href="#'+s.key+'" data-sec="'+s.key+'">'+s.label+'</a>';
    }).join('');
    document.getElementById('d2Sections').innerHTML = SECTIONS.map(function(s){
      return '<section class="d2-sec" id="'+s.key+'"><h2 class="d2-sectitle">'+s.label+'</h2>'+s.html+'</section>';
    }).join('');

    /* ----- Sticky in-page nav + scrollspy ----- */
    function stickTop(){ var n=document.querySelector('.topnav'); return (n ? n.offsetHeight : 118); }
    function setStick(){ document.documentElement.style.setProperty('--stick', stickTop()+'px'); }
    setStick();
    window.addEventListener('resize', setStick);
    window.addEventListener('load', setStick);
    setTimeout(setStick, 350); /* หลัง site.js inject nav + โลโก้โหลด */
    var tabs = [].slice.call(document.querySelectorAll('.d2-tab'));
    var ids = SECTIONS.map(function(s){ return s.key; });
    if(!ids.length) return;
    function setActive(id){ tabs.forEach(function(t){ t.classList.toggle('on', t.dataset.sec===id); }); }
    tabs.forEach(function(t){
      t.addEventListener('click', function(e){
        e.preventDefault();
        var headH = document.querySelector('.d2-head').offsetHeight;
        var target = document.getElementById(t.dataset.sec);
        var y = target.getBoundingClientRect().top + window.scrollY - stickTop() - headH - 12;
        window.scrollTo({top:y, behavior:'smooth'});
      });
    });
    window.addEventListener('scroll', function(){
      var headH = document.querySelector('.d2-head').offsetHeight;
      var line = window.scrollY + stickTop() + headH + 40;
      var active = ids[0];
      ids.forEach(function(id){
        var top = document.getElementById(id).getBoundingClientRect().top + window.scrollY;
        if(top <= line) active = id;
      });
      setActive(active);
    }, {passive:true});
  })();
</script>
<script src="site.js"></script>
</body>
</html>
