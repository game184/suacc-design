<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>บทความ · SUACC</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* ===== Blog article — editorial layout ===== */
  body{background:#fff}
  .post{max-width:820px;margin:0 auto;padding:56px 24px 40px;text-align:center}
  .post-cat{font-family:var(--head);font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 18px}
  .post-title{font-family:var(--head);font-size:clamp(29px,4vw,44px);line-height:1.2;font-weight:700;color:#0d0d0d;margin:0 auto 30px;max-width:760px}
  .post-byline{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:34px;text-align:left}
  .post-author{display:flex;align-items:center;gap:14px}
  .post-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#0a7256,#03bf9e);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  .post-avatar svg{width:26px;height:26px}
  .post-author-name{display:block;font-weight:700;font-size:16px;color:#0d0d0d}
  .post-date{display:block;font-size:14px;color:#7a7f87;margin-top:2px}
  .post-share{display:flex;align-items:center;gap:16px}
  .post-share a{color:#0d0d0d;display:flex;transition:.15s}
  .post-share a:hover{color:#03bf9e}
  .post-share svg{width:22px;height:22px}
  .post-hero{margin:0 0 46px}
  .post-hero img{width:100%;height:auto;display:block;border-radius:12px}
  .post-body{max-width:720px;margin:0 auto;text-align:left}
  .post-body p{margin:0 0 22px;font-size:18px;line-height:1.9;color:#2a2d31}
  .post-body h3{font-family:var(--head);font-size:24px;line-height:1.4;margin:40px 0 14px;color:#0d0d0d}
  .post-body figure{margin:36px 0}
  .post-body img{width:100%;border-radius:12px;display:block}
  .post-body figcaption{margin-top:10px;font-size:14px;color:#7a7f87;text-align:center;line-height:1.5}
  .post-foot{max-width:720px;margin:48px auto 0;padding-top:26px;border-top:1px solid var(--line);text-align:left}
  @media(max-width:640px){.post{padding:36px 20px 30px}.post-body p{font-size:17px}}
</style>
</head>
<body>
<div id="site-nav"></div>

<article class="post" id="maincontent" tabindex="-1">
  <p class="post-cat" id="dCat"></p>
  <h1 class="post-title" id="dTitle"></h1>
  <div class="post-byline">
    <div class="post-author">
      <div class="post-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></div>
      <div>
        <span class="post-author-name" id="dAuthor"></span>
        <span class="post-date" id="dDate"></span>
      </div>
    </div>
    <div class="post-share">Share :
      <a href="#" aria-label="แชร์ X"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.53 3h3.2l-6.99 7.99L22 21h-6.43l-5.03-6.58L4.78 21H1.58l7.48-8.55L2 3h6.6l4.55 6.01L17.53 3zm-1.12 16h1.77L7.67 4.9H5.77L16.41 19z"/></svg></a>
      <a href="#" aria-label="แชร์ LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.94 5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM3 8.5h3.9V21H3zM9.4 8.5h3.7v1.7h.05c.52-.93 1.8-1.9 3.7-1.9 3.96 0 4.7 2.4 4.7 5.5V21h-3.9v-5.4c0-1.3 0-3-1.85-3s-2.1 1.44-2.1 2.9V21H9.4z"/></svg></a>
      <a href="#" aria-label="แชร์ Facebook"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 22v-8h2.7l.4-3H13V9.2c0-.86.3-1.45 1.55-1.45H16.2V5.1C15.83 5.05 14.9 5 13.86 5 11.66 5 10.13 6.34 10.13 8.8V11H7.5v3h2.63v8H13z"/></svg></a>
      <a href="#" aria-label="คัดลอกลิงก์"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9.5 14.5l5-5"/><path d="M11 6.5l1-1a4 4 0 0 1 5.7 5.7l-2 2"/><path d="M13 17.5l-1 1a4 4 0 0 1-5.7-5.7l2-2"/></svg></a>
    </div>
  </div>

  <figure class="post-hero"><img id="dHero" alt=""></figure>

  <div class="post-body" id="dBody"></div>

  <div class="post-foot">
    <a class="btn ghost" href="blog.html">← กลับไปหน้าบทความ</a>
  </div>
</article>

<div id="site-footer"></div>
<script src="whatson-data.js"></script>
<script>
  (function(){
    var id = parseInt((new URLSearchParams(location.search)).get('id'), 10);
    var ev = (window.BLOG||[]).filter(function(e){return e.id===id;})[0] || (window.BLOG||[])[0];
    if(!ev) return;
    document.title = ev.title.replace(/[“”]/g,'') + ' · SUACC';
    var cat=document.getElementById('dCat');
    cat.textContent = ev.tag;
    cat.style.color = ev.tagColor || '#7a7f87';
    document.getElementById('dTitle').textContent = ev.title;
    document.getElementById('dAuthor').textContent = ev.author || 'กองบรรณาธิการ SUACC';
    document.getElementById('dDate').textContent = ev.date;
    document.getElementById('dHero').src = ev.img;

    var html = '';
    if(ev.body && ev.body.length){
      html = ev.body.map(function(b){
        if(b.type==='h') return '<h3>'+b.text+'</h3>';
        if(b.type==='img') return '<figure><img src="'+b.src+'" alt="'+(b.cap||'')+'" loading="lazy">'+(b.cap?'<figcaption>'+b.cap+'</figcaption>':'')+'</figure>';
        return '<p>'+b.text+'</p>';
      }).join('');
    } else {
      html = '<p>'+(ev.excerpt||'')+'</p>';
    }
    document.getElementById('dBody').innerHTML = html;
  })();
</script>
<script src="site.js"></script>
</body>
</html>
